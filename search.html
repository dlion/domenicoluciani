---
layout: default
title: Search
permalink: /search/
hide_progress: true
---
<section class="search">
  <h1>Search</h1>
  <input id="searchInput" class="search-input" type="search" placeholder="Search posts…"
         aria-label="Search posts">
  <div class="search-options">
    <label class="search-option">
      <input id="searchContentToggle" type="checkbox">
      Search post content
    </label>
    <label class="search-option">
      <input id="searchBookmarksToggle" type="checkbox">
      Include bookmarks
    </label>
    <label class="search-option">
      <input id="searchNotesToggle" type="checkbox">
      Include notes
    </label>
  </div>
  <ul id="results" class="search-results"></ul>
</section>

<script>
  // Tiny client-side search (same as before if you kept it) – just wiring to theme vars
  (function() {
    var input = document.getElementById('searchInput');
    var results = document.getElementById('results');
    var contentToggle = document.getElementById('searchContentToggle');
    var bookmarksToggle = document.getElementById('searchBookmarksToggle');
    var notesToggle = document.getElementById('searchNotesToggle');
    if (results) {
      results.setAttribute('aria-live', 'polite');
    }

    var sources = {
      posts: null,
      bookmarks: null,
      notes: null
    };
    var loading = {
      posts: false,
      bookmarks: false,
      notes: false
    };
    var urls = {
      posts: {{ "/posts.json" | relative_url | jsonify }},
      bookmarks: {{ "/bookmarks.json" | relative_url | jsonify }},
      notes: {{ "/notes.json" | relative_url | jsonify }}
    };

    function escapeHtml(str) {
      var map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      };
      return str.replace(/[&<>'"]/g, function(ch) { return map[ch]; });
    }

    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlight(text, query) {
      if (!text) return '';
      if (!query) return escapeHtml(text);
      var safeText = escapeHtml(text);
      var re = new RegExp(escapeRegExp(query), 'ig');
      return safeText.replace(re, function(match) {
        return '<mark class="search-hit">' + match + '</mark>';
      });
    }

    function buildSnippet(text, query, radius) {
      if (!text || !query) return '';
      var lower = text.toLowerCase();
      var q = query.toLowerCase();
      var idx = lower.indexOf(q);
      if (idx === -1) return '';
      var start = Math.max(0, idx - radius);
      var end = Math.min(text.length, idx + q.length + radius);
      var prefix = start > 0 ? '…' : '';
      var suffix = end < text.length ? '…' : '';
      return prefix + text.slice(start, end) + suffix;
    }

    function render(list, query) {
      if (!query) {
        results.innerHTML = '';
        return;
      }

      if (!list.length) {
        results.innerHTML = '<li class="search-empty">No articles match <strong>&ldquo;' + escapeHtml(query) + '&rdquo;</strong>. Try another keyword.</li>';
        return;
      }

      results.innerHTML = list.map(function(item) {
        var p = item.post || item;
        var description = p.desc || p.excerpt || '';
        var titleHtml = highlight(p.title, query);
        var descHtml = description ? '<div class="desc">' + highlight(description, query) + '</div>' : '';
        var snippet = '';
        if (item.contentHit) {
          snippet = buildSnippet(p.content, query, 60);
        }
        var snippetHtml = snippet ? '<div class="desc content-snippet">Content: ' + highlight(snippet, query) + '</div>' : '';
        var where = [];
        if (item.titleHit) where.push('Title');
        if (item.descHit) where.push('Description');
        if (item.contentHit) where.push('Content');
        var whereHtml = where.length ? '<span class="search-hits">Found in: ' + where.join(', ') + '</span>' : '';
        var classes = 'search-item';
        if (p.type === 'note') {
          classes += ' is-note';
        } else if (p.type === 'bookmark') {
          classes += ' is-bookmark';
        }
        return '<li class="'+classes+'"><a href="'+p.url+'">'+titleHtml+'</a><div class="meta">'+p.date+whereHtml+'</div>'+descHtml+snippetHtml+'</li>';
      }).join('');
    }

    function normalizeData(list, type) {
      return (list || []).map(function(item) {
        var tags = Array.isArray(item.tags) ? item.tags : [];
        return {
          title: item.title || '',
          url: item.url || '',
          date: item.date || '',
          desc: item.description || '',
          excerpt: item.excerpt || '',
          content: item.content || '',
          type: type || item.type || 'post',
          tags: tags.map(function(tag) { return String(tag || '').toLowerCase(); })
        };
      });
    }

    function loadIndex(kind, url, type) {
      if (loading[kind]) return Promise.resolve();
      loading[kind] = true;
      return fetch(url)
        .then(function(response) {
          if (!response.ok) {
            throw new Error('Search index unavailable');
          }
          return response.json();
        })
        .then(function(json) {
          sources[kind] = normalizeData(json, type);
        })
        .catch(function() {
          sources[kind] = [];
        })
        .finally(function() {
          loading[kind] = false;
        });
    }

    function ensureData(includeBookmarks, includeNotes, showLoading) {
      var tasks = [];
      if (!sources.posts) {
        tasks.push(loadIndex('posts', urls.posts, 'post'));
      }
      if (includeBookmarks && !sources.bookmarks) {
        tasks.push(loadIndex('bookmarks', urls.bookmarks, 'bookmark'));
      }
      if (includeNotes && !sources.notes) {
        tasks.push(loadIndex('notes', urls.notes, 'note'));
      }
      if (!tasks.length) return Promise.resolve();
      if (showLoading) {
        results.innerHTML = '<li class="search-empty">Loading search index…</li>';
      }
      return Promise.all(tasks).then(function() { return true; }, function() { return false; });
    }

    function buildData(includeBookmarks, includeNotes) {
      var list = [];
      if (sources.posts) list = list.concat(sources.posts);
      if (includeBookmarks && sources.bookmarks) list = list.concat(sources.bookmarks);
      if (includeNotes && sources.notes) list = list.concat(sources.notes);
      return list;
    }

    function runSearch() {
      var raw = input.value;
      var q = raw.toLowerCase().trim();
      if (!q) {
        render([], '');
        return;
      }

      var includeBookmarks = bookmarksToggle && bookmarksToggle.checked;
      var includeNotes = notesToggle && notesToggle.checked;

      ensureData(includeBookmarks, includeNotes, true).then(function() {
        var liveRaw = input.value;
        var liveQ = liveRaw.toLowerCase().trim();
        if (!liveQ) {
          render([], '');
          return;
        }

        var includeContent = contentToggle && contentToggle.checked;
        var includeBookmarksNow = bookmarksToggle && bookmarksToggle.checked;
        var includeNotesNow = notesToggle && notesToggle.checked;
        var data = buildData(includeBookmarksNow, includeNotesNow);
        var matches = data.reduce(function(acc, p) {
          var titleHit = p.title.toLowerCase().indexOf(liveQ) > -1;
          var descHit = p.desc && p.desc.toLowerCase().indexOf(liveQ) > -1;
          var allowContent = includeContent || p.type === 'note';
          var contentHit = allowContent && p.content && p.content.toLowerCase().indexOf(liveQ) > -1;
          if (titleHit || descHit || contentHit) {
            acc.push({
              post: p,
              titleHit: titleHit,
              descHit: descHit,
              contentHit: contentHit
            });
          }
          return acc;
        }, []);
        render(matches, liveRaw.trim());
      });
    }

    ensureData(false, false, false);
    input.addEventListener('input', runSearch);
    if (contentToggle) {
      contentToggle.addEventListener('change', runSearch);
    }
    if (bookmarksToggle) {
      bookmarksToggle.addEventListener('change', runSearch);
    }
    if (notesToggle) {
      notesToggle.addEventListener('change', runSearch);
    }
  })();
</script>
