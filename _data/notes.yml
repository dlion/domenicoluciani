  content: |
    I'm twickling this space to be more "personal", and since I like taking pictures theresn't better place to have them than my digital garden. 🪴   
    Every year I create an Instagram backup, and this year I decided to have a copy of my account here on this blog.   
    Moreover, let's say tomorrow Instagram decides to explode and with it all my memories, I don't want to risk it, so today I decided to copy most of my pictures in the [/photos](/photos) section.
    Yes, I will keep doing my yearly backups but at the same time, I'm sure I will have them always online thanks to my garden.

