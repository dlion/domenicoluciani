---
layout: default
title: Search
permalink: /search/
hide_progress: true
---
<section class="search">
  <h1>Search</h1>
  <input id="searchInput" class="search-input" type="search" placeholder="Search posts…"
         aria-label="Search posts">
  <div class="search-options">
    <label class="search-option">
      <input id="searchContentToggle" type="checkbox">
      Search post content
    </label>
    <label class="search-option">
      <input id="searchBookmarksToggle" type="checkbox">
      Include bookmarks
    </label>
  </div>
  <ul id="results" class="search-results"></ul>
</section>

<script>
  // Tiny client-side search (same as before if you kept it) – just wiring to theme vars
  (function() {
    var input = document.getElementById('searchInput');
    var results = document.getElementById('results');
    var contentToggle = document.getElementById('searchContentToggle');
    var bookmarksToggle = document.getElementById('searchBookmarksToggle');
    if (results) {
      results.setAttribute('aria-live', 'polite');
    }

    var data = [];
    var dataReady = false;

    function escapeHtml(str) {
      var map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      };
      return str.replace(/[&<>'"]/g, function(ch) { return map[ch]; });
    }

    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlight(text, query) {
      if (!text) return '';
      if (!query) return escapeHtml(text);
      var safeText = escapeHtml(text);
      var re = new RegExp(escapeRegExp(query), 'ig');
      return safeText.replace(re, function(match) {
        return '<mark class="search-hit">' + match + '</mark>';
      });
    }

    function buildSnippet(text, query, radius) {
      if (!text || !query) return '';
      var lower = text.toLowerCase();
      var q = query.toLowerCase();
      var idx = lower.indexOf(q);
      if (idx === -1) return '';
      var start = Math.max(0, idx - radius);
      var end = Math.min(text.length, idx + q.length + radius);
      var prefix = start > 0 ? '…' : '';
      var suffix = end < text.length ? '…' : '';
      return prefix + text.slice(start, end) + suffix;
    }

    function render(list, query) {
      if (!query) {
        results.innerHTML = '';
        return;
      }

      if (!list.length) {
        results.innerHTML = '<li class="search-empty">No articles match <strong>&ldquo;' + escapeHtml(query) + '&rdquo;</strong>. Try another keyword.</li>';
        return;
      }

      results.innerHTML = list.map(function(item) {
        var p = item.post || item;
        var description = p.desc || p.excerpt || '';
        var titleHtml = highlight(p.title, query);
        var descHtml = description ? '<div class="desc">' + highlight(description, query) + '</div>' : '';
        var snippet = '';
        if (item.contentHit) {
          snippet = buildSnippet(p.content, query, 60);
        }
        var snippetHtml = snippet ? '<div class="desc content-snippet">Content: ' + highlight(snippet, query) + '</div>' : '';
        var where = [];
        if (item.titleHit) where.push('Title');
        if (item.descHit) where.push('Description');
        if (item.contentHit) where.push('Content');
        var whereHtml = where.length ? '<span class="search-hits">Found in: ' + where.join(', ') + '</span>' : '';
        return '<li><a href="'+p.url+'">'+titleHtml+'</a><div class="meta">'+p.date+whereHtml+'</div>'+descHtml+snippetHtml+'</li>';
      }).join('');
    }

    function normalizeData(list) {
      return (list || []).map(function(item) {
        var tags = Array.isArray(item.tags) ? item.tags : [];
        return {
          title: item.title || '',
          url: item.url || '',
          date: item.date || '',
          desc: item.description || '',
          excerpt: item.excerpt || '',
          content: item.content || '',
          tags: tags.map(function(tag) { return String(tag || '').toLowerCase(); })
        };
      });
    }

    function loadData() {
      var dataUrl = {{ "/search.json" | relative_url | jsonify }};
      fetch(dataUrl)
        .then(function(response) {
          if (!response.ok) {
            throw new Error('Search index unavailable');
          }
          return response.json();
        })
        .then(function(json) {
          data = normalizeData(json);
          dataReady = true;
          runSearch();
        })
        .catch(function() {
          data = [];
          dataReady = true;
        });
    }

    function runSearch() {
      var raw = input.value;
      var q = raw.toLowerCase().trim();
      if (!q) {
        render([], '');
        return;
      }

      if (!dataReady) {
        results.innerHTML = '<li class="search-empty">Loading search index…</li>';
        return;
      }

      var includeContent = contentToggle && contentToggle.checked;
      var includeBookmarks = bookmarksToggle && bookmarksToggle.checked;
      var matches = data.reduce(function(acc, p) {
        if (!includeBookmarks && p.tags.indexOf('bookmarks') > -1) {
          return acc;
        }
        var titleHit = p.title.toLowerCase().indexOf(q) > -1;
        var descHit = p.desc && p.desc.toLowerCase().indexOf(q) > -1;
        var contentHit = includeContent && p.content && p.content.toLowerCase().indexOf(q) > -1;
        if (titleHit || descHit || contentHit) {
          acc.push({
            post: p,
            titleHit: titleHit,
            descHit: descHit,
            contentHit: contentHit
          });
        }
        return acc;
      }, []);
      render(matches, raw.trim());
    }

    loadData();
    input.addEventListener('input', runSearch);
    if (contentToggle) {
      contentToggle.addEventListener('change', runSearch);
    }
    if (bookmarksToggle) {
      bookmarksToggle.addEventListener('change', runSearch);
    }
  })();
</script>
