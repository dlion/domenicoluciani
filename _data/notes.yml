    So the notes section **IS ALIVE**.
    ![alive](https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExeng0cDMyY2pxcHhrbW1jaXI2b3BoNmhpZWFjeGZtbGFpOWh2cWZ5byZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/vmv47p4zksWDC/giphy.gif)
    I have been thinking about this new section for a while now, I need a place where to store some ideas, like for new blogs posts or just a place where to rant/comment/write about something that wouldn't be a proper blog post.  
    So here we are. Each note has an embedded tagging system so I can connect ideas and see the whole picture in one sight.  
    Don't expect meaningful notes here or well-organized tags, this place is just for me, and if you find here something useful well, good for you ✨
