timeline:
  - date: 2025-10-04
    body: |-
      ### Work 🧑🏻‍💻
      - I'm working at Deel, as a Senior Software engineer. I've been working there for 5 months now.
      - I'm doing fun and challenging stuff, learning a lot going often outside of my comfort zone, leading already some interesting initiatives.
      - Tech stack: Node.js on AWS.

      ### Personal Life 🪴
      - I'm 33 years old. 🧓🏻
      - I live in Málaga with my Spanish girlfriend. 🇪🇸
      - I try to focus on an healthy lifestyle, at least during the week. 🏋🏻‍♂️
      - I'm very happy about the result of this blog, I want to keep growing it and make it more personal.

      ### Travels ✈️
      - This year I visited: Egypt, Indonesia and Greece for the first time. 🇪🇬 🇮🇩 🇬🇷
        <div class="now-gallery">
          <img src="/assets/images/about/travels/2025/20250413_145310.jpg" alt="egypt" loading="lazy">
          <img src="/assets/images/about/travels/2025/20250802_153354.jpg" alt="indonesia" loading="lazy">
          <img src="/assets/images/about/travels/2025/20250829_155735.jpg" alt="greece" loading="lazy">
        </div>
      - In a week I will going back to Ireland, visiting it for a few days, I will land in Cork, and then go back to Málaga from Dublin. It's gonna be a quick but intense trip. 🇮🇪
      - During my Christmas holidays I'd like to go to a location where I can feel the christmas spirit, let's see if I find interesting deals. 🎄
  - date: 2025-11-03
    body: |-
      ### Travels ✈️
      - From Málaga travelled to Cork, visiting the cliffs of Moher, then to Dublin 🇮🇪
        <div class="now-gallery">
          <img src="/assets/images/about/travels/2025/20251012_174249.jpg" alt="ireland-beer" loading="lazy">
          <img src="/assets/images/about/travels/2025/20251011_113746.jpg" alt="ireland-cliffs" loading="lazy">
          <img src="/assets/images/about/travels/2025/20251013_153404.jpg" alt="ireland-library" loading="lazy">
        </div>
      - Visited [Bosque de Cobre](https://maps.app.goo.gl/bJQddnS8R5PEirdF9), a beatiful forest near Marbella/Estepona famous for its Autumn vibes during this period of the year. 🍂
        <div class="now-gallery">
          <img src="/assets/images/about/travels/2025/20251102_124722.jpg" alt="bosque-de-cobre" loading="lazy">
          <img src="/assets/images/about/travels/2025/20251102_132253.jpg" alt="bosque-de-cobre-2" loading="lazy">
          <img src="/assets/images/about/travels/2025/20251102_132331.jpg" alt="bosque-de-cobre-3" loading="lazy">
        </div>
      - I'm exploring now where to go in December, we have one long weekend I can use and of course the Christmas holidays. 🎄
      
      ### Personal Life 🪴
      - I want to get back at writing some articles, I already started with one which I will publish very soon, it's about a specific team ceremony. ⏮️
      - I'm thinking about buying an house here in Málaga, next year I will commit on doing it, I guess it's finally time for me to have a place I can call "home". 🏠
  - date: 2025-12-14
    body: |-
      ### Travels ✈️
      - From Málaga, I travelled to Denmark 🇩🇰.
        I spent 4 days there visiting Copenhagen and enjoying the beautiful Christmas markets.
        <div class="now-gallery">
          <img src="/assets/images/about/travels/2025/copenhagen1.jpeg" alt="copenhagen1" loading="lazy">
          <img src="/assets/images/about/travels/2025/copenhagen2.jpeg" alt="copenhagen2" loading="lazy">
          <img src="/assets/images/about/travels/2025/copenhagen3.jpeg" alt="copenhagen3" loading="lazy">
        </div>
        I also took a day trip to Malmö, Sweden, thanks to the beautiful bridge that connects these two countries.
        <div class="now-gallery">
          <img src="/assets/images/about/travels/2025/malmo1.jpeg" alt="malmo1" loading="lazy">
          <img src="/assets/images/about/travels/2025/malmo2.jpeg" alt="malmo2" loading="lazy">
          <img src="/assets/images/about/travels/2025/malmo3.jpeg" alt="malmo3" loading="lazy">
        </div>
      - In a few weeks, I will go to Berlin, Germany, spending almost one week there. I'm wondering if it will be colder than Copenhagen, not sure I'm ready for that. 🥶
      - Just because I really don't like cold places, early next year I will go to Iceland with some friends to hunt the famous northern lights. I'm looking forward to it, but I guess it will be my last trip to a cold place for a while. ☃️


      ### Personal Life 🪴
      - Today is my best friend's birthday. If you ever read this, Stefano, happy birthday, buddy! 🎂
