  - date: 2026-01-03
    body: |-
      ### Travels ✈️
      - From Málaga, I travelled to Germany 🇩🇪.
        I spent a whole week there visiting Berlin,
        I had to wear multiple layers of thermal clothes in order to be okaysh 🥶, so yes it was way colder than Copenhagen ☃️, but beside the cold it was quite nice, I liked Berlin and its Christmas vibes. 🎄
        <div class="now-gallery">
          <img src="/assets/images/about/travels/2025/berlin1.jpeg" alt="berlin1" loading="lazy">
          <img src="/assets/images/about/travels/2025/berlin2.jpeg" alt="berlin2" loading="lazy">
          <img src="/assets/images/about/travels/2025/berlin3.jpeg" alt="berlin3" loading="lazy">
        </div>
      - In a week I will be visiting Iceland 🇮🇸 for the first time ever, hunting the northern lights 🌌.
        I'm sure it's going to be a lifetime experience, I always dreamed about them and I hope the weather would help me out on achieving this goal.
        For sure, it's going to be my last cold place for the year, I'm more a beach guy, sorry not sorry. 🏖️
      
      ### Personal Life 🪴
      - New Year new resolutions, I've been thinking about them and there are some that are quite a challenge so let's see how it goes.
        * Buy an apartment here in Málaga
        * Keep travelling, I'd like to explore a bit more of Asia, like Vietnam or Philipines.
        * Keep training and improve my weight, my goal is to reduce my fat in my trunk and keep growing muscles. I will stop eating this much and training more.
        * Create a community, instead of looking for something I like, I would try to start something mine, I have the necessary skills and tools, I just need to put some real effort on it, and go out from my comfort zone.
        * Learn how to play ukulele, I bought one two years ago and I never learned how to play it.
        * Visit some friends, I have close friends scattered around the world, I'd like to visit them this year.
        * Come back home in Sicily visiting my mom more often, I don't go back to Palermo that much, logistically it's a nightmare but it can be worse, I have the freedom to travel and work from there, so no more finding excuses because of the flights being expensive and the trip being very long.
        * Find more friends who match my new lifestyle.
        * Keep writing on this blog
      
      ### Gaming 🕹️
      Last year I played a lot to release the stress, all games I finished:
      - God of war Ragnarok 1 and 2 🪓
      - The last of us part 1 and 2 🦠
      - Days Gone 🏍️
      - Stray 🐈‍
      - Ratchet and Clank rift apart 🤖
      - Sword of the sea 🏄🏻‍♂️
      - Lies of P 🤥
      - Kena: Birdge of the Spirits 💎
      - Detroit 🏙️   
      Games in progress:
      - Wo Long: Fallen Destiny 🐉
      - Howgarts Legacy 🧙🏻
      - Ghost of Tsushima 🏯

      ### Work 🧑🏻‍💻
      - It was a very fun and interesting year at Deel, I learned **a lot**, specifically on these 3 topics:
        * Infra
        * Observability
        * Team processes
      - The feedback I have got during these first 7 months was stellar, and I couldn't be more happy about it. My effort is well recognised and it's seen as a reference within my team.
      - I have lots of ideas about how to make Deel better, how to solve some pain points and how to deliver more value to our customers. I'm looking forward to see it happening.
      - I really like the product, I've always been a huge fan of remote work and our product definitely reflect what I want to see in the future: more freedom for everyone.
  - date: 2026-02-04
    body: |-
      ### Travels ✈️
      - From Málaga, I travelled to Iceland 🇮🇸.   
        I spent a whole week there, doing a road trip by car in the southwest of the island.   
        To be honest, I didn't feel that cold. It was windy and, of course, temperatures were below zero sometimes, but it didn't feel as cold as Berlin the month before. 😳   
        I had the chance to see the northern lights on multiple occasions during my trip, and I almost cried because of their incredible beauty.   
        It was like a river in the sky 🌌: sometimes it was really intense and you could see a bright green light with the naked eye; other times it looked like a dark cloud, visible only with a long exposure on my camera.   
        <div class="now-gallery">
          <img src="/assets/images/about/travels/2026/iceland1.png" alt="iceland1" loading="lazy">
          <img src="/assets/images/about/travels/2026/iceland2.png" alt="iceland2" loading="lazy">
          <img src="/assets/images/about/travels/2026/iceland3.png" alt="iceland3" loading="lazy">
        </div>
      - My next trips will definitely be to warmer countries (spring is coming 🤩💐). This year I'm thinking of visiting the Philippines or Vietnam (Asia is my comfort continent 💅🏻).
      - I'm also thinking about visiting Istanbul. I've always been curious about the city from a historical point of view (and I like kebabs 🥙), so it's definitely on my bucket list for this year.
      
      ### Personal Life 🪴
      - I've been growing my hair out and trying to style it better, but I still need to find the right barber/hairstylist. I'm aiming for a style similar to the Italian model Mariano Di Vaio, but I need to wait until it's long enough to pull it off.
      - I started running at least 5 km every week. I joined a young, friendly community here in Málaga that meets every Saturday. I really like it, and it makes running even better.

      ### Work 🧑🏻‍💻
      - For the past few weeks, I've been working on improving my company's processes. It's been a super fun activity, since I really care about following best practices and standardizing processes.   
        I've led many initiatives that changed how we develop software at Deel: improving our internal knowledge base, reinforcing best practices, and standardizing ways of working.   
        I still have a lot to do, but I'm really happy with what I've achieved so far. 💪
  - date: 2026-03-19
    body: |-
      ### Travels ✈️
      - From Málaga, I travelled to Palermo, Sicily 🇮🇹.   
        I spent a whole week there; the last time I went back home was almost a year ago 🤯. There aren't any direct flights from Málaga, so going back isn't really something I think about very often.
        I missed my hometown's peculiarities, I missed its street food, and I was happy to see again some old friends I left there.
        Despite being proud of my roots, it's sad to say, but it's unlikely that I will ever move back to Sicily. It is what it is.
