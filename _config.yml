# ——— Site identity ———
title: "Domenico Luciani"
description: "Thoughts about life, tech and everything"

# For project sites: url is the domain root, baseurl is the repo path
url: "https://domenicoluciani.com"
baseurl: ""

# Ko-fi button link (used under posts)
kofi_link: "https://ko-fi.com/I2I23YM3I"

# ——— Author ———
author: "Domenico Luciani"
author_avatar: "/assets/images/profile.png" # used by post layout

# Social links (render anywhere)
links:
  - label: "GitHub"
    url: "https://github.com/dlion"
    rel: "me"
  - label: "LinkedIn"
    url: "https://linkedin.com/in/dlion"
  - label: "X"
    url: "https://x.com/DLion92"
  - label: "Mastodon"
    url: "https://mastodon.social/@dlion"
    rel: "me"

# ——— Navigation ——— (consumed by the header)
nav:
  - { title: Home, url: "/" }
  - { title: About, url: "/about/" }
  - { title: Now, url: "/now/" }
  - { title: Tags, url: "/tags/" }
  - { title: Search, url: "/search/" }
  - { title: Bookmarks, url: "/bookmarks/" }

# ——— Writing ———
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true # can override per block: ```go linenos
    span:
      disable: true

permalink: /:year/:month/:day/:title.html
timezone: Europe/Madrid
paginate: 10
paginate_path: "/page/:num/"

# ——— Plugins (all supported by GitHub Pages) ———
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-mentions
  - jemoji
  - jekyll-seo-tag
  - jekyll-paginate

# ——— Defaults ———
defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: post
      lang: en
      categories: []
      tags: []
      toc: false

# ——— Build ———
exclude:
  - README.md
  - node_modules
  - .github
  - Gemfile
  - Gemfile.lock
  - vendor

# Copy dot-directories like .well-known to the output
include:
  - .well-known

# Social preview defaults (used for og:image dimensions)
social_preview:
  default_width: 1200
  default_height: 630

# Twitter card type — ensure large image card
twitter:
  username: DLion92
  card: summary_large_image

hero:
  image: /assets/images/covers/iron-giant-hero.jpg
  kicker: Domenico Luciani
  title: Tech Garden 🪴
  # Position the hero image so the eyes are prominent
  pos: 50% 30%

# ——— About page config ———
about:
  tagline: |-
    Passionate programmer, 🧑🏻‍💻
    with 10+ years of experience as a software engineer, including 8 years as eXtreme programmer 🪂🤸
    Working remotely from Spain. 🛰️ 🇪🇸
    Open Source enthusiast and greedy learner. 📚🧑🏻‍🏫🧑🏻‍🎓
    Focusing on software craftsmanship, and product engineering. 🪚🔨📐
  location: Málaga, ES 🇪🇸
  github:
    username: dlion
    show_metrics: true
  avatar_pos: 50% 50% # default object-position for avatar (x y)
