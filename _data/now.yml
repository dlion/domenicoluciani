  - date: 2026-04-08
    body: |-
      ### Travels ✈️
      - I went to Istanbul and Cappadocia 🇹🇷.
        I spent 4 days in Istanbul and 4 days in Cappadocia, and it was a wonderful experience.
        I ate lots of delicious kebabs and drank an embarrassing amount of Turkish tea. 🍵
        I rode Turkish horses, saw beautiful landscapes, and made a Turkish lamp with my own hands. 🪔
        What I didn't like was that it rained for 2 days straight without interruption, and I didn't get the chance to ride in a hot-air balloon. I really wanted to try that experience, especially since I wasn't lucky enough to do it in Luxor, but never mind, who knows, maybe one day if the weather allows it.
        <div class="now-gallery">
          <img src="/assets/images/about/travels/2026/istanbul1.jpg" alt="ist1" loading="lazy">
          <img src="/assets/images/about/travels/2026/istanbul2.jpg" alt="ist2" loading="lazy">
          <img src="/assets/images/about/travels/2026/cappadocia3.jpg" alt="cappadocia3" loading="lazy">
        </div>
      - I had a short layover in Sofia, Bulgaria 🇧🇬, but I wasn't really impressed by the city, probably because I didn't spend much time there. The people I met were a bit rude and the weather wasn't great either. Maybe I'll come back at a better time. 🌸
      - May 1st is almost here, and since it's a public holiday, I'm thinking about doing another trip, probably to Menorca or Mallorca, but I still have to think about it.

      ### Personal Life 🪴
      - I'm back at the gym. All this travelling didn't really help my routine or my shape, so I need to lift more, eat better and less, and do more cardio. 🏃🏻
      - I want to learn Japanese. I have a friend who owns a language school where they teach it, and they're good and affordable, so I decided to take this chance and learn a bit of one of my favourite languages. 🇯🇵

      ### Work 🧑🏻‍💻
      - At work, I joined a "creatorship" academy, where we're taught how to grow our personal brand and make posts that actually get people to follow and comment. The platform we have to use is LinkedIn.
        The goal is to publish at least 20 posts per month. I'm about to publish my 19th post, and I'm quite happy with the results so far. More people are reaching out, commenting on my posts, and interacting with me in useful ways. I guess posting valuable content helps.
        If I make it into the first 300 people in my company to gain some traction, I might get into the official program with some extra benefits, but to be frank I don't care that much about it.
      - Apparently, lots of changes will be happening this month: teams being split and people getting promotions, but everything is still blurry. It should be clearer next week, when my team lead is back from his well-deserved holiday.
  - date: 2026-05-13
    body: |-
      ### Travels ✈️
      - I went to Mallorca 🇪🇸
        The weather wasn't the best, but I enjoyed Mallorca's cristal clear waters, stunning landscapes and nice roads.   
        It wasn't my first visit in Mallorca, the first time was in the 2017, I don't remember much, beside the fantastic beaches, and it's funny thinking that after 2 years from there I would have moved to Spain and learned to speak Spanish.
        <div class="now-gallery">
          <img src="/assets/images/about/travels/2026/mallorca1.jpg" alt="mallorca1" loading="lazy">
          <img src="/assets/images/about/travels/2026/mallorca2.jpg" alt="mallorca2" loading="lazy">
          <img src="/assets/images/about/travels/2026/mallorca3.jpg" alt="mallorca3" loading="lazy">
        </div>
      - For end of May I have to go to Madrid for some bureaucracy for just 2 days, it's gonna be a good occasion to walk around one of my favourite capitals.
      - For June I'm thinking to work for a week from Morocco, I want to do some surf after work 🏄🏻‍♂️, I think it's time to get serious with this sport and learn properly.

      ### Personal Life 🪴
      - Today I have done the check at the gym and I have got the fantastic news that I have improved since January by a lot:
        Compared with December 31st, 2025:
        - Weight: 68.9 kg, down 1.1 kg.
        - Muscle mass: 32.9 kg, up 1.0 kg.
        - Body fat mass: 11.3 kg, down 2.7 kg.
        - Body fat percentage: 16.4%, down 3.6 percentage points.
        - BMI: 25.3, down 0.4.
        - Basal metabolic rate: 1614 kcal, up 35 kcal.
        - Waist-hip ratio: 0.84, down 0.05.
        - Visceral fat level: 4, down 1 level.
        - Total body water: 42.1 L, up 1.0 L.
        - Protein: 11.6 kg, up 0.4 kg.
        - Minerals: 3.89 kg, up 0.22 kg.
        - Skeletal muscle mass index: 8.5 kg/m², up 0.1.
        - Whole-body phase angle: 7.8°, up 0.2°.
        - Segmental muscle changed a little: right arm -0.01 kg, left arm -0.02 kg, trunk unchanged, right leg +0.15 kg, left leg +0.12 kg.
        - Segmental fat went down everywhere: right arm -0.1 kg, left arm -0.2 kg, trunk -1.6 kg, right leg -0.3 kg, left leg -0.3 kg.
        
        > It ain't much, but it's honest work 🏋🏻‍♂️

      ### Work 🧑🏻‍💻
      - After more than 13 years as a software engineer, I decided to start walking forward a path I didn't really consider until now: ✨ be a manager ✨.   
        My team was too big (14 people), so my my managers decided to split it into 3 smaller teams, and thanks to my technical and people skills, I've been choosen to lead one of them.   
        I'm still in the transitioning phase, which it makes all things more difficult but at the same time easier. I start getting more responsibilities, without taking care of EVERYTHING.   
        For this first quarter my scope is just about organizing the team's work, taking over of some stuff, conducting interviews but still being very active as an individual contributor.   
        In the next quarter I will start taking more management work, like having regular 1:1s, doing performance reviews and of course, getting more and more responsibilities.   
        It's an exciting path, I still have to wrap my head around certain dynamics but I find it challenging and quite fun, my only concern is about my work-life balance, I don't really want to sacrify it, so I hope to not have to do it. 👀   
        The nice part is that I can always go back to my old role, it makes it a fantastic occasion to learn how to be a good manager without having the title (or the salary...), I'm glad tho to have this opportunity, and I'm excited to see what the future will be for me.
      - In a few days I will celebrate 1 year at Deel, I can truly say to be happy to be working in such company. We do lots of cool stuff and I learn a lot, almost every day. I love the product, and I love enabling people working remotely around the planet. Go full-remote! 👩‍💻🧑🏻‍💻
